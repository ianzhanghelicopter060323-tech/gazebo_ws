# Effective values copied from ~/car/src/gazebo_nav/config/move_base.
local_costmap:
  global_frame: map
  robot_base_frame: base_link
  # Keep the hard collision model slightly tighter than TEB's obstacle
  # constraint.  The 0.01 m costmap padding gives an effective axis-aligned
  # half-width of 0.09 m; TEB uses the same body polygon plus 0.02 m clearance.
  footprint: [[0.08, -0.08], [0.08, 0.08], [-0.08, 0.08], [-0.08, -0.08]]

  footprint_padding: 0.01
  update_frequency: 10
  publish_frequency: 10
  rolling_window: true
  width: 3.0
  height: 3.0
  resolution: 0.05
  transform_tolerance: 10
  # Override both shared/global inflation values. This isolates the wide-route
  # experiment to GlobalPlanner and preserves the validated local cost field.
  inflation_layer:
    inflation_radius: 0.16
    cost_scaling_factor: 15.0
  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
