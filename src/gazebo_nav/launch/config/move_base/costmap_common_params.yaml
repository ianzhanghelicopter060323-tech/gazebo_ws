# Shared obstacle and inflation layers. Robot geometry is intentionally split:
# global_costmap uses a small radius for route availability, while
# local_costmap uses the navigation footprint for collision checking.

obstacle_layer:
  enabled: true
  combination_method: 1
  track_unknown_space: true
  obstacle_range: 2.0
  raytrace_range: 3.0
  observation_sources: laser_scan_sensor
  laser_scan_sensor:
    # Current car3 hardware frame; ~/car uses laser_frame.
    sensor_frame: laser_link
    data_type: LaserScan
    topic: scan
    marking: true
    clearing: true
    inf_is_valid: true

inflation_layer:
  enabled: true
  # Global planning uses a wider, more slowly decaying soft-cost band so the
  # official GlobalPlanner prefers the wider side of a cone/wall passage.
  # local_costmap_params.yaml overrides both values to preserve local motion.
  cost_scaling_factor: 7.5
  # 全局规划保留绕行偏好，同时给锥桶密集入口留下可达通道；局部代价地图另有独立覆盖。
  # 0.33m在source-round-009的入口第一滚动点曾限制路径推进；回调至
  # 0.30m释放进入空间。防撞底线仍由avoidance footprint和TEB硬净距负责。
  inflation_radius: 0.30

static_layer:
  enabled: true
