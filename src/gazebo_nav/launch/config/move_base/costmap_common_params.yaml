# Shared obstacle and inflation layers. Robot geometry is intentionally split:
# global_costmap uses a small radius for route availability, while
# local_costmap uses the navigation footprint for collision checking.

obstacle_layer:
  enabled: true
  combination_method: 1
  track_unknown_space: true
  obstacle_range: 2.0
  raytrace_range: 3.0
  observation_sources: laser_scan_sensor
  laser_scan_sensor:
    # Current car3 hardware frame; ~/car uses laser_frame.
    sensor_frame: laser_link
    data_type: LaserScan
    topic: scan
    marking: true
    clearing: true
    inf_is_valid: true

inflation_layer:
  enabled: true
  cost_scaling_factor: 15.0
  # Shared/global default. local_costmap_params.yaml narrows only its own
  # inflation layer to 0.18 m without changing the global path costmap.
  inflation_radius: 0.20

static_layer:
  enabled: true
