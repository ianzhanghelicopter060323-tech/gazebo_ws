# 通用代价地图参数（适用于 global_costmap 与 local_costmap）

# 全程固定使用同一安全 footprint：几何半尺寸由 0.120 m 增至 0.132 m，
# padding 由 0.010 m 增至 0.012 m；有效半尺寸 0.144 m，相对原值增加约 10.8%。
footprint: [[0.132, -0.132], [0.132, 0.132], [-0.132, 0.132], [-0.132, -0.132]]
footprint_padding: 0.012
# robot_radius: 0.20   # 比实际略大一点，提高导航安全性

obstacle_layer:
  enabled: true
  combination_method: 1     # 1 表示取最大值
  track_unknown_space: true
  obstacle_range: 4.0       # 障碍探测半径（推荐保持 2m）
  raytrace_range: 4.0       # 清除障碍的射线距离（略小于原来的3.0）
  observation_sources: laser_scan_sensor
  laser_scan_sensor:
    sensor_frame: laser_link
    data_type: LaserScan
    topic: scan
    marking: true
    clearing: true
    inf_is_valid: true

inflation_layer:
  enabled: true
  cost_scaling_factor: 2.8      # 保持代价衰减不变，先单独评估 footprint/膨胀半径影响
  # inflation_radius 由 gazebo_nav.launch 分别写入 global_costmap 和 local_costmap，
  # 避免公共配置将两个膨胀半径绑定为同一个值。

static_layer:
  enabled: true
