DWAPlannerROS:
  # 机器人物理参数
  acc_lim_x: 1.3
  acc_lim_y: 1.3
  acc_lim_theta: 4.0

  max_vel_x: 1.3
  min_vel_x: -1.3
  max_vel_y: 1.3
  min_vel_y: -1.3

  # 机器人平移速度
  max_vel_trans: 1.25
  min_vel_trans: 0.15

  max_vel_theta: 1.6
  min_vel_theta: 0.30

  trans_stopped_vel: 0.1
  theta_stopped_vel: 0.10

  # 目标容忍度
  yaw_goal_tolerance: 0.04 # 0.10 
  xy_goal_tolerance: 0.04 # 0.10
  latch_xy_goal_tolerance: true

  # 前向模拟参数
  sim_time: 1.0
  sim_granularity: 0.025
  vx_samples: 20
  vy_samples: 10
  # 60 angular samples made each 10 Hz cycle score 12,000 velocity
  # combinations and repeatedly miss its deadline. 32 retains roughly
  # 0.10 rad/s angular resolution while cutting total candidates to 6,400.
  vth_samples: 32
  controller_frequency: 10.0

  # 轨迹评分参数
  path_distance_bias: 32.0
  goal_distance_bias: 18.0
  # 在保持速度、加速度和到达容差不变的前提下，提高障碍代价权重。
  occdist_scale: 0.150
  forward_point_distance: 0.20
  stop_time_buffer: 0.20
  scaling_speed: 0.65
  max_scaling_factor: 0.2
  twirling_scale: 0.0
  publish_cost_grid: false

  # 振荡预防参数
  oscillation_reset_dist: 0.05

  # 规划处理
  prune_plan: true
  global_frame_id: map

  publish_traj_pc: false
  publish_cost_grid_pc: false
