DWAPlannerROS:
  # 机器人物理参数
  # 平移速度和加速度相对 automatic_navigation 旧值提高约 10%。
  acc_lim_x: 1.1
  acc_lim_y: 1.1
  acc_lim_theta: 6.0

  max_vel_x: 0.88
  min_vel_x: -0.88
  max_vel_y: 0.66
  min_vel_y: -0.66

  max_vel_trans: 1.10
  min_vel_trans: 0.05

  # 提高方向修正速度，同时保留接近目标朝向时的细调能力。
  max_vel_theta: 1.0
  min_vel_theta: 0.30

  trans_stopped_vel: 0.1
  theta_stopped_vel: 0.10

  # 目标容忍度
  # 0.10 rad 约为 5.7°；配合较低角速度提高精度并减少终点超调
  yaw_goal_tolerance: 0.10
  xy_goal_tolerance: 0.10  # local costmap 为 0.04 m/格，保留至少 2.5 格的可达终点容差
  latch_xy_goal_tolerance: true

  # 前向模拟参数
  sim_time: 1.0           # 缩短预测距离，避免狭窄处过早判定全部轨迹不可行
  sim_granularity: 0.025
  vx_samples: 20           # x方向采样点数
  vy_samples: 10           # y方向采样点数，麦伦轮必需
  vth_samples: 60          # 增加角速度采样，提升旋转轨迹的可选性
  controller_frequency: 10.0

  # 轨迹评分参数
  path_distance_bias: 32.0
  goal_distance_bias: 18.0
  occdist_scale: 0.08
  forward_point_distance: 0.20
  stop_time_buffer: 0.20
  scaling_speed: 0.65
  max_scaling_factor: 0.2
  twirling_scale: 0.0
  publish_cost_grid: false

  # 振荡预防参数
  oscillation_reset_dist: 0.05

  # 规划处理
  prune_plan: true
  global_frame_id: map

  publish_traj_pc: false
  publish_cost_grid_pc: false
