# 普通自动导航参数配置。
#
# 当前数值是现用 DWA、local costmap 和 costmap common 参数的完整快照。
# gazebo_nav.launch 尚未加载本文件，因此新增本文件不会改变当前导航行为；
# 后续可在验证完成后独立缩小局部地图并提高速度。

DWAPlannerROS:
  # 机器人物理参数
  acc_lim_x: 1.0
  acc_lim_y: 1.0
  acc_lim_theta: 5.0

  max_vel_x: 0.8
  min_vel_x: -0.8
  max_vel_y: 0.6
  min_vel_y: -0.6

  max_vel_trans: 1.0
  min_vel_trans: 0.05

  max_vel_theta: 0.6
  min_vel_theta: 0.4

  trans_stopped_vel: 0.1
  theta_stopped_vel: 0.10

  # 目标容忍度
  yaw_goal_tolerance: 0.10
  xy_goal_tolerance: 0.10
  latch_xy_goal_tolerance: true

  # 前向模拟参数
  sim_time: 1.0
  sim_granularity: 0.025
  vx_samples: 20
  vy_samples: 10
  vth_samples: 40
  controller_frequency: 10.0

  # 轨迹评分参数
  path_distance_bias: 26.0
  goal_distance_bias: 20.0
  occdist_scale: 0.04
  forward_point_distance: 0.3
  stop_time_buffer: 0.15
  scaling_speed: 0.65
  max_scaling_factor: 0.2
  publish_cost_grid: false

  # 振荡预防参数
  oscillation_reset_dist: 0.05

  # 规划处理
  prune_plan: true
  global_frame_id: map

  publish_traj_pc: false
  publish_cost_grid_pc: false

  hdiff_scale: 1.0
  heading_points: 1

local_costmap:
  global_frame: odom
  robot_base_frame: base_footprint

  update_frequency: 10.0
  publish_frequency: 3.0

  static_map: false
  rolling_window: true

  width: 4.0
  height: 4.0
  resolution: 0.04

  transform_tolerance: 0.3

  # 改小了footprint，由 [+-0.12, +-0.12] 到 [+-0.10, +-0.10]
  footprint: [[0.10, -0.10], [0.10, 0.10], [-0.10, 0.10], [-0.10, -0.10]]
  footprint_padding: 0.01

  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  obstacle_layer:
    enabled: true
    combination_method: 1
    track_unknown_space: true
    obstacle_range: 4.0
    raytrace_range: 4.0
    observation_sources: laser_scan_sensor
    laser_scan_sensor:
      sensor_frame: laser_link
      data_type: LaserScan
      topic: scan
      marking: true
      clearing: true
      inf_is_valid: true

  inflation_layer:
    enabled: true
    inflation_radius: 0.10 # 由 0.15 改成 0.10
    cost_scaling_factor: 2.8

  static_layer:
    enabled: true
