# 普通自动导航参数配置。gazebo_nav.launch 启动后由 profile manager 应用；
# DWAPlannerROS 段与 dwa_local_planner_params.yaml 保持一致，避免启动前后配置歧义。

DWAPlannerROS:
  # 机器人物理参数
  acc_lim_x: 1.3
  acc_lim_y: 1.3
  acc_lim_theta: 6.3

  max_vel_x: 1.5
  min_vel_x: -1.5
  max_vel_y: 1.5
  min_vel_y: -1.5

  # 机器人平移速度
  max_vel_trans: 1.35
  min_vel_trans: 0.15

  max_vel_theta: 1.6
  min_vel_theta: 0.40

  trans_stopped_vel: 0.1
  theta_stopped_vel: 0.10

  # 目标容忍度
  yaw_goal_tolerance: 0.10
  xy_goal_tolerance: 0.10
  latch_xy_goal_tolerance: true

  # 前向模拟参数
  sim_time: 1.0
  sim_granularity: 0.025
  vx_samples: 20
  vy_samples: 10
  vth_samples: 60
  controller_frequency: 10.0

  # 轨迹评分参数
  path_distance_bias: 32.0
  goal_distance_bias: 18.0
  occdist_scale: 0.08
  forward_point_distance: 0.20
  stop_time_buffer: 0.20
  scaling_speed: 0.65
  max_scaling_factor: 0.2
  twirling_scale: 0.0
  publish_cost_grid: false

  # 振荡预防参数
  oscillation_reset_dist: 0.05

  # 规划处理
  prune_plan: true
  global_frame_id: map

  publish_traj_pc: false
  publish_cost_grid_pc: false

local_costmap:
  global_frame: odom
  robot_base_frame: base_footprint

  update_frequency: 10.0
  publish_frequency: 3.0

  static_map: false
  rolling_window: true

  width: 4.0
  height: 4.0
  resolution: 0.04

  transform_tolerance: 0.3

  # 改小了footprint，由 [+-0.12, +-0.12] 到 [+-0.10, +-0.10]
  footprint: [[0.08, -0.08], [0.08, 0.08], [-0.08, 0.08], [-0.08, -0.08]]
  footprint_padding: 0.01

  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  obstacle_layer:
    enabled: true
    combination_method: 1
    track_unknown_space: true
    obstacle_range: 4.0
    raytrace_range: 4.0
    observation_sources: laser_scan_sensor
    laser_scan_sensor:
      sensor_frame: laser_link
      data_type: LaserScan
      topic: scan
      marking: true
      clearing: true
      inf_is_valid: true

  inflation_layer:
    enabled: true
    inflation_radius: 0.08 # 由 0.15 改成 0.10
    cost_scaling_factor: 2.8

  static_layer:
    enabled: true
