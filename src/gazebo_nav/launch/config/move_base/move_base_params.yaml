# Effective values copied from ~/car/src/gazebo_nav/config/move_base.
shutdown_costmaps: false

controller_frequency: 15
controller_patience: 2.0

planner_frequency: 5.0
planner_patience: 15.0

# Tight waypoint yaw alignment can legitimately rotate in place. Do not treat
# that as a stuck robot after only four seconds or require 0.3 m translation to
# reset the watchdog.
oscillation_timeout: 10.0
oscillation_distance: 0.05

recovery_behavior_enabled: true
clearing_rotation_allowed: false
