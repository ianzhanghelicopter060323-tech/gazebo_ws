# TEB-native baseline derived from the stable DWA motion limits.
# DWA-only keys (min_vel_*, max_vel_trans, stopped_vel) are intentionally not
# copied: teb_local_planner 0.9.1 does not consume them.
TebLocalPlannerROS:
  odom_topic: odom
  map_frame: map

  # TEB limits x/y separately and has no max_vel_trans. 0.9 m/s per axis caps
  # simultaneous diagonal motion at about 1.27 m/s, matching DWA's 1.25 m/s.
  max_vel_x: 0.9
  max_vel_y: 0.9
  max_vel_x_backwards: 0.9
  max_vel_theta: 1.6
  acc_lim_x: 1.3
  acc_lim_y: 1.3
  acc_lim_theta: 4.0
  min_turning_radius: 0.0

  is_footprint_dynamic: false
  footprint_model:
    type: polygon
    vertices: [[0.08, -0.08], [0.08, 0.08], [-0.08, 0.08], [-0.08, -0.08]]

  xy_goal_tolerance: 0.04
  # Exact 0.04 rad alignment caused intermediate waypoints that had already
  # reached their position to oscillate until move_base recovery aborted.
  yaw_goal_tolerance: 0.04 # 原0.15
  free_goal_vel: false

  teb_autosize: true
  dt_ref: 0.10
  dt_hysteresis: 0.02
  min_samples: 5
  max_samples: 500
  global_plan_overwrite_orientation: true
  global_plan_viapoint_sep: 0.10
  via_points_ordered: true
  max_global_plan_lookahead_dist: 1.3
  force_reinit_new_goal_dist: 1.0
  # Check the imminent portion of the band. A value of 20 rejected commands
  # during otherwise recoverable tight turns far ahead of the robot.
  feasibility_check_no_poses: 5
  publish_feedback: false
  allow_init_with_backwards_motion: false
  exact_arc_length: true

  # The polygon matches local_costmap before its 0.01 m padding.  This hard
  # clearance gives TEB an effective 0.10 m side distance, slightly exceeding
  # local_costmap's 0.09 m collision model so optimized trajectories also pass
  # the final feasibility check.
  min_obstacle_dist: 0.02
  inflation_dist: 0.08
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 0.5
  include_dynamic_obstacles: false
  legacy_obstacle_association: false
  obstacle_association_force_inclusion_factor: 2.0
  obstacle_association_cutoff_factor: 5.0
  obstacle_poses_affected: 30
  costmap_converter_plugin: ""
  costmap_converter_spin_thread: true
  costmap_converter_rate: 5.0

  no_inner_iterations: 5
  no_outer_iterations: 4
  optimization_activate: true
  optimization_verbose: false
  penalty_epsilon: 0.02
  weight_max_vel_x: 2.0
  weight_max_vel_y: 2.0
  weight_max_vel_theta: 1.0
  weight_acc_lim_x: 1.0
  weight_acc_lim_y: 1.0
  weight_acc_lim_theta: 1.0
  weight_kinematics_nh: 1.0
  weight_kinematics_forward_drive: 0.0
  weight_kinematics_turning_radius: 0.0
  weight_optimaltime: 1.0
  weight_shortest_path: 0.0
  weight_obstacle: 100.0
  weight_inflation: 0.2
  weight_viapoint: 20.0
  weight_adapt_factor: 2.0

  # Keep the 100-round pre-navigation baseline on the stable single-band TEB.
  # The aggressive HCP values below remain recorded but are inactive until a
  # cone-zone-only profile or adaptive planner mode is introduced.
  enable_homotopy_class_planning: false
  enable_multithreading: true
  max_number_classes: 3
  roadmap_graph_no_samples: 20
  roadmap_graph_area_width: 2.5

  # Prefer candidates with real obstacle clearance. Keep global-plan
  # via-points as guidance for the initial class only so other topologies can
  # move to a genuinely different corridor in the cone zone.
  selection_obst_cost_scale: 5.0
  selection_viapoint_cost_scale: 0.5
  selection_prefer_initial_plan: 0.95
  selection_cost_hysteresis: 1.0
  switching_blocking_period: 1.0
  viapoints_all_candidates: false

  shrink_horizon_backup: true
  shrink_horizon_min_duration: 10.0
  oscillation_recovery: true
