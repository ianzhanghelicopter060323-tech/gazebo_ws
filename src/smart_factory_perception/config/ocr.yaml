ocr:
  model_dir: models/ocr
  min_text_confidence: 0.45
  class_threshold: 0.70
  # Preserve normal samples at native resolution and enlarge only after the
  # closed-set keyword classifier rejects the preceding attempt.
  input_scale: 1.0
  # Retry larger inputs only when the preceding scale has no accepted keyword.
  retry_scales: [2.0, 4.0]
  vote_window: 5
  vote_minimum: 3

classes:
  FOOD:
    full: ["食品物块"]
    partial: ["食品"]
  DAILY:
    full: ["日用物块", "日用品物块"]
    partial: ["日用", "日用品"]
  ELECTRONICS:
    full: ["电子物块", "电子产品物块"]
    partial: ["电子", "电子产品"]
