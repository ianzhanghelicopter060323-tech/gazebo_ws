# Canonical runtime parameters owned by smart_factory_navigation.
# Values were migrated from smart_factory_mission/config/mission.yaml.
navigation:
  action_name: /move_base
  server_wait_timeout: 10.0
  goal_timeout: 60.0
  max_retries: 1
  route_execution_mode: fitted_path_lookahead
  path_tracking:
    path_topic: /sim_task/reference_path
    tracking_goal_topic: /sim_task/tracking_goal
    progress_topic: /sim_task/path_progress
    control_frequency: 20.0
    # Keep path tracking at 20 Hz, but do not forward and log every control
    # sample through both navigation and mission Action servers.
    progress_feedback_frequency: 2.0
    acquire_radius: 0.20
    lookahead_min: 0.20
    lookahead_max: 0.50
    lookahead_curvature_gain: 0.45
    projection_window: 1.0
    goal_update_distance: 0.12
    goal_update_period: 0.8
    cross_track_warn: 0.08
    cross_track_abort: 0.25
    progress_timeout: 15.0
    progress_epsilon: 0.05
    final_phase_distance: 0.30
    route_timeout: 240.0
    direct_segments:
      - [21, 22]
    # Retained for exact deployment-config parity; consumed by the offline path
    # fitter, not by the runtime RouteExecutor.
    fit_y_floor_segments:
      - [20, 21]
    heading_locks:
      - start_seq: 16
        full_lock_seq: 17
        end_seq: 20
        direction_start_seq: 17
        direction_end_seq: 18
        release_distance: 0.12
      - start_seq: 20
        full_lock_seq: 21
        end_seq: 22
        direction_start_seq: 21
        direction_end_seq: 22
        release_distance: 0.12
  intermediate_pass_radius: 0.20
  heading_constrained_waypoints: []
  intermediate_yaw_tolerance: 0.25
  heading_alignment_timeout: 8.0
  heading_alignment_kp: 1.0
  heading_alignment_min_angular_speed: 0.40
  heading_alignment_max_angular_speed: 0.45
  cmd_vel_topic: /cmd_vel

localization:
  amcl_topic: /amcl_pose
  map_frame: map
  base_frame: base_footprint
  wait_timeout: 10.0
  max_pose_age: 1.0
  max_tf_age: 1.0
  allow_stale_pose_with_fresh_tf: true
  max_xy_variance: 0.05
  max_yaw_variance: 0.10
  require_tf: true
  nomotion_update_service: /request_nomotion_update
  nomotion_update_period: 1.0

# Direct base translation is physically navigation even though it is initiated
# by the pickup pipeline. Parameter names remain unchanged for behavior parity.
pickup:
  direct_alignment_tolerance: 0.008
  direct_alignment_gain: 1.0
  direct_alignment_min_speed: 0.05
  direct_alignment_max_speed: 0.08
  direct_alignment_timeout: 8.0
