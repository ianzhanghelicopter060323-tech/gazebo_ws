# Canonical runtime parameters owned by smart_factory_navigation.
# Values were migrated from smart_factory_mission/config/mission.yaml.
navigation:
  action_name: /move_base
  server_wait_timeout: 10.0
  # Allow one difficult move_base segment up to six wall-clock minutes before
  # navigation retry/abort handling takes over. The stress runner keeps its
  # separate eight-minute whole-task ceiling.
  goal_timeout: 360.0
  max_retries: 1
  # A tolerance-pass cancels its action before the delivery selector calls
  # /move_base/make_plan. Wait for move_base to leave ACTIVE/PREEMPTING so the
  # public planning service does not reject an otherwise valid request.
  goal_cancel_timeout: 2.0
  # Follow 13 executable route anchors
  # (6/9/10/16/17/18/20/21/22/29/33/34/35). Intermediate goals
  # normally advance on a position-only radius; orientation-required anchors
  # and seq35 additionally check yaw.
  fitted_waypoints:
    count: 13
    chord_error: 0.05
    # The route's tightest bend still needs 0.16 m so every next goal stays
    # outside the 0.15 m intermediate pass radius.
    min_spacing: 0.16
    max_spacing: 0.50
    # The execution subset equals the active route anchors; seq35 (the route
    # end) is included automatically as the last fitted waypoint.
    required_sequences: [6, 9, 10, 16, 17, 18, 20, 21, 22, 29, 33, 34]
    # These fitted-route anchors advance only after both position and heading
    # are correct. Seq17 and seq18 both require position and heading before
    # leaving the narrow outbound corridor. Seq21 must satisfy its tighter
    # position radius and heading before execution advances to seq22.
    orientation_required_sequences: [17, 18, 21]
    orientation_yaw_tolerance: 0.15
    orientation_position_tolerance_overrides:
      "21": 0.10
    # Offline-only geometry constraints used by the path/PNG generator.
    direct_segments:
      - [21, 22]
    fit_y_floor_segments:
      - [20, 21]
  intermediate_pass_radius: 0.15
  # Canonical global position radius for the final pickup staging goal (seq35).
  # Formal tasks still require final yaw alignment; the position-only bypass is
  # owned exclusively by the pre-navigation stress-test client.
  final_pass_radius: 0.15
  final_yaw_tolerance: 0.04
  cmd_vel_topic: /cmd_vel
  recovery:
    enabled: true
    # Stuck is now a 25 s window with only 0.02 m of amcl displacement. The
    # longer window makes the judgment robust to TEB's own corrective jitter
    # before a true no-progress jam is declared.
    no_progress_timeout: 25.0
    minimum_progress_distance: 0.02
    # Up to two recovery behaviors per waypoint. After each escape the base
    # holds post_escape_wait, then move_base resumes navigation; if the same
    # waypoint triggers stuck again, a second, distinct recovery runs instead
    # of oscillating inside one behavior.
    max_attempts_per_waypoint: 2
    speed: 0.05
    # Escape distance is hard-capped here, but the real limiter is the wall
    # clock: wall_timeout 2.0 s x 0.05 m/s ~= 0.1 m of actual escape travel,
    # so max_distance stays unchanged.
    max_distance: 0.08
    wall_timeout: 2.0
    # Hold the stopped base after an escape before resuming move_base. This
    # gives local planners time to re-race cleanly and separates consecutive
    # recovery behaviors so they cannot oscillate.
    post_escape_wait: 3.0
    scan_topic: /scan
    scan_sector_half_angle: 0.52
    # Escape distance = distance_scale_factor * chosen-direction sector
    # clearance, capped at max_distance. 0.7 leaves a 30% safety margin and
    # avoids the fixed 0.08 m cap overshooting into a tight gap.
    distance_scale_factor: 0.7
    # Lateral (strafe) escape: when BOTH the front and rear sector clearances
    # are below strafe_front_rear_threshold (robot jammed nose-to-tail in a fan
    # dead-end) but one side gap reaches strafe_side_gap_threshold, strafe
    # along the base_link y-axis (linear.y, omnidirectional planar_move) toward
    # the larger gap so the next channel selection sees open space.
    strafe_enabled: true
    strafe_front_rear_threshold: 0.40
    strafe_side_gap_threshold: 0.50
    # Side sectors are +-45 deg around the left/right axes (45-135 deg and
    # 225-315 deg in scan frame).
    strafe_side_sector_half_angle: 0.78
    strafe_speed: 0.30
    strafe_distance: 0.30
    # One strafe step is 0.30 m; up to two steps per escape, capped at 0.60 m
    # total, within a 4.0 s wall budget.
    strafe_max_total: 0.60
    strafe_wall_timeout: 4.0

localization:
  amcl_topic: /amcl_pose
  map_frame: map
  base_frame: base_footprint
  wait_timeout: 10.0
  max_pose_age: 1.0
  max_tf_age: 1.0
  allow_stale_pose_with_fresh_tf: true
  max_xy_variance: 0.05
  max_yaw_variance: 0.10
  require_tf: true
  nomotion_update_service: /request_nomotion_update
  nomotion_update_period: 1.0

# Direct base translation is physically navigation even though it is initiated
# by the pickup pipeline. Parameter names remain unchanged for behavior parity.
pickup:
  direct_alignment_tolerance: 0.008
  direct_alignment_gain: 1.0
  direct_alignment_min_speed: 0.05
  direct_alignment_max_speed: 0.08
  direct_alignment_timeout: 8.0
  direct_alignment_wall_timeout: 45.0
  direct_alignment_clock_stall_timeout: 10.0
