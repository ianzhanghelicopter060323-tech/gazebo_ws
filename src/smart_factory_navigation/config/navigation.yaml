# Canonical runtime parameters owned by smart_factory_navigation.
# Values were migrated from smart_factory_mission/config/mission.yaml.
navigation:
  action_name: /move_base
  server_wait_timeout: 10.0
  # Allow one difficult move_base segment up to six wall-clock minutes before
  # navigation retry/abort handling takes over. The stress runner keeps its
  # separate eight-minute whole-task ceiling.
  goal_timeout: 360.0
  max_retries: 1
  # A tolerance-pass cancels its action before the delivery selector calls
  # /move_base/make_plan. Wait for move_base to leave ACTIVE/PREEMPTING so the
  # public planning service does not reject an otherwise valid request.
  goal_cancel_timeout: 2.0
  # Generate a 30-point fitted reference and follow its executable goals.
  # Intermediate goals normally advance on a position-only radius; configured
  # anchors and seq35 additionally check yaw.
  fitted_waypoints:
    count: 30
    chord_error: 0.05
    # The current 63-point reference needs 0.16 m to preserve its tightest
    # bends while still keeping every next goal outside the 0.15 m pass radius.
    min_spacing: 0.16
    max_spacing: 0.50
    # Keep the channel-entry turn in the 30 executable goals. Seq 15 remains a
    # fitted-path anchor, but is not forced into the execution subset: after
    # the current seq 16 adjustment their fitted arc separation is only about
    # 0.05 m, below both the 0.16 m goal-spacing rule and 0.15 m pass radius.
    required_sequences: [1, 16, 17, 18, 21, 22]
    # These fitted-route anchors advance only after both position and heading
    # are correct. Seq1 establishes the eastbound heading before the first turn.
    # Seq17 and seq18 both require position and heading before leaving the
    # narrow outbound corridor. Seq21 starts the 180-degree turn and must
    # satisfy both position and
    # heading. Seq22 remains a required coordinate, but advances on the normal
    # intermediate pass radius so its following turn is not over-constrained.
    orientation_required_sequences: [1, 17, 18, 21]
    orientation_yaw_tolerance: 0.15
    # Offline-only geometry constraints used by the path/PNG generator.
    direct_segments:
      - [21, 22]
    fit_y_floor_segments:
      - [20, 21]
  intermediate_pass_radius: 0.15
  # Canonical global position radius for the final pickup staging goal (seq35).
  # Formal tasks still require final yaw alignment; the position-only bypass is
  # owned exclusively by the pre-navigation stress-test client.
  final_pass_radius: 0.15
  final_yaw_tolerance: 0.04
  cmd_vel_topic: /cmd_vel

localization:
  amcl_topic: /amcl_pose
  map_frame: map
  base_frame: base_footprint
  wait_timeout: 10.0
  max_pose_age: 1.0
  max_tf_age: 1.0
  allow_stale_pose_with_fresh_tf: true
  max_xy_variance: 0.05
  max_yaw_variance: 0.10
  require_tf: true
  nomotion_update_service: /request_nomotion_update
  nomotion_update_period: 1.0

# Direct base translation is physically navigation even though it is initiated
# by the pickup pipeline. Parameter names remain unchanged for behavior parity.
pickup:
  direct_alignment_tolerance: 0.008
  direct_alignment_gain: 1.0
  direct_alignment_min_speed: 0.05
  direct_alignment_max_speed: 0.08
  direct_alignment_timeout: 8.0
