# Mission orchestration parameters. No track coordinates belong in this file.
pipeline_stop_after: OBJECT_GRASPED
goal_source: development

task:
  remember_completed_results: 20

navigation:
  action_name: /move_base
  server_wait_timeout: 10.0
  goal_timeout: 60.0
  max_retries: 1
  # Keep legacy_waypoints available as a rollback. The fitted mode publishes a
  # latched reference Path, tracks monotonic arc progress, and replaces a moving
  # lookahead MoveBaseGoal without inserting an explicit cancel/stop gap.
  route_execution_mode: fitted_path_lookahead
  path_tracking:
    path_topic: /sim_task/reference_path
    tracking_goal_topic: /sim_task/tracking_goal
    progress_topic: /sim_task/path_progress
    control_frequency: 20.0
    acquire_radius: 0.20
    # Must remain well above DWA's 0.10 m xy_goal_tolerance; otherwise a sharp
    # bend can make the moving target look already reached and stall progress.
    lookahead_min: 0.20
    lookahead_max: 0.50
    lookahead_curvature_gain: 0.45
    projection_window: 1.0
    goal_update_distance: 0.12
    goal_update_period: 0.8
    cross_track_warn: 0.08
    cross_track_abort: 0.25
    progress_timeout: 15.0
    progress_epsilon: 0.05
    final_phase_distance: 0.30
    route_timeout: 240.0
    # Export seq 21 -> 22 as an exact reference-path line. At runtime, also
    # jump the moving target to the seq 22 anchor once progress enters it.
    direct_segments:
      - [21, 22]
    # Offline fitting only: keep the seq 20 -> 21 approach from dipping below
    # the lower of its measured anchors before the exact seq 21 -> 22 line.
    fit_y_floor_segments:
      - [20, 21]
    # Each lock blends toward its straight-section direction before the full-lock
    # anchor, holds that yaw after the anchor, then releases over the final 0.12 m.
    # Position targets continue following the fitted/direct path unchanged.
    heading_locks:
      - start_seq: 16
        full_lock_seq: 17
        end_seq: 20
        direction_start_seq: 17
        direction_end_seq: 18
        release_distance: 0.12
      - start_seq: 20
        full_lock_seq: 21
        end_seq: 22
        direction_start_seq: 21
        direction_end_seq: 22
        release_distance: 0.12
  # Intermediate route points normally advance on position alone. Selected route
  # waypoint numbers cancel their active move_base goal after entering the pass
  # radius, rotate in place to their configured yaw, and then advance. The final
  # point remains fully precise.
  intermediate_pass_radius: 0.20
  # Temporarily disable the seq 6 -> 7 heading-alignment gate.
  # heading_constrained_waypoints: [6]
  heading_constrained_waypoints: []
  intermediate_yaw_tolerance: 0.25
  heading_alignment_timeout: 8.0
  heading_alignment_kp: 1.0
  # The Gazebo chassis barely responds below about 0.3 rad/s. Keep the in-place
  # command above static friction while retaining the existing 0.45 rad/s cap.
  heading_alignment_min_angular_speed: 0.40
  heading_alignment_max_angular_speed: 0.45
  cmd_vel_topic: /cmd_vel

localization:
  amcl_topic: /amcl_pose
  map_frame: map
  base_frame: base_footprint
  wait_timeout: 10.0
  # AMCL may keep the last pose stamp while a localized robot is stationary.
  # A stale pose is accepted only while the live map-to-base TF remains fresh.
  max_pose_age: 1.0
  max_tf_age: 1.0
  allow_stale_pose_with_fresh_tf: true
  max_xy_variance: 0.05
  max_yaw_variance: 0.10
  require_tf: true
  # AMCL may publish its initial pose before the mission subscriber is ready.
  # Request a no-motion update while waiting so a late manual task cannot miss
  # the only stationary /amcl_pose sample and be rejected before departure.
  nomotion_update_service: /request_nomotion_update
  nomotion_update_period: 1.0

# Conditional recognition and fixed-standoff grasp after the fitted route ends
# at seq35.  The fixed target was calibrated headlessly on 2026-08-06 from
# base_footprint -> tcp_link at arm pose [0, 1.5, 1.4, -1, 0]:
# translation ~= [0.356, 0.000, 0.018] m.
pickup:
  enabled: true
  frame_id: map
  perception_service: /cube_locator/locate
  perception_wait_timeout: 30.0
  recognition_retries: 1

  # A visual correction is rejected if it asks the base to move farther than
  # this.  Two stop/re-observe corrections are allowed before grasping.
  alignment_tolerance: 0.015
  maximum_alignment_correction: 0.25
  maximum_alignment_iterations: 2
  # The planar base can translate laterally.  Small grasp corrections therefore
  # use a slow, heading-preserving closed loop instead of asking DWA to rotate.
  direct_alignment_tolerance: 0.008
  direct_alignment_gain: 1.0
  # The simulated planar chassis does not reliably move at centimetre-scale
  # commands below about 0.05 m/s.
  direct_alignment_min_speed: 0.05
  direct_alignment_max_speed: 0.08
  direct_alignment_timeout: 8.0

  fixed_grasp:
    target_forward: 0.356
    target_lateral: 0.0
    # Headless RGB-D/Gazebo-truth comparison at all three stations measured
    # depth-point-minus-center forward errors of +0.011, +0.011, -0.003 m.
    # The signed -5 mm correction minimizes the worst observed center error.
    depth_to_center_forward: -0.005

  stations:
    - number: 35
      x: -1.2243
      y: -0.52503905352630406
      yaw: 0.00007722691751649312
      # All 80 successful close_navi samples used the common 2.10 scan pose.
      scan_positions: [0.0, 0.0, 0.55, 2.10, 0.0]
    - number: 36
      x: -1.395
      y: -0.235
      yaw: 1.5691910264536908
      scan_positions: [0.0, 0.0, 0.55, 2.10, 0.0]
    - number: 37
      x: -1.65569836894096
      y: -0.44503905352630406
      yaw: 3.141482426814858
      scan_positions: [0.0, 0.0, 0.55, 2.10, 0.0]

  manipulation:
    arm_command_topic: /arm_controller/command
    gripper_command_topic: /gripper_controller/command
    joint_state_topic: /joint_states
    ready_topic: /grasp_attach/ready
    state_topic: /grasp_attach/state
    open_position: 1.5
    open_minimum: 1.4
    closed_position: 0.76
    arm_duration: 3.0
    arm_tolerance: 0.03
    command_timeout: 8.0
    grasp_positions: [0.0, 1.5, 1.4, -1.0, 0.0]
