# Mission orchestration parameters. No track coordinates belong in this file.
pipeline_stop_after: TASK_COMPLETED
goal_source: development

task:
  remember_completed_results: 20

# Conditional recognition and fixed-standoff grasp after the fitted route ends
# at seq35.  The fixed target was calibrated headlessly on 2026-08-06 from
# base_footprint -> tcp_link at arm pose [0, 1.5, 1.4, -1, 0]:
# translation ~= [0.356, 0.000, 0.018] m.
pickup:
  enabled: true
  frame_id: map
  perception_service: /cube_locator/locate
  perception_wait_timeout: 30.0
  recognition_retries: 1

  # A visual correction is rejected if it asks the base to move farther than
  # this.  Two stop/re-observe corrections are allowed before grasping.
  alignment_tolerance: 0.010
  maximum_alignment_correction: 0.30
  maximum_alignment_iterations: 4 # 最大机器人对齐物品重试数
  secondary_alignment_max_correction: 0.05
  secondary_alignment_iterations: 1
  depth_recheck_attempts: 2
  station_area_tolerance: 0.03
  fixed_grasp:
    target_forward: 0.326 # 留出的机器人底盘与物品距离，给机械臂
    target_lateral: 0.0
    # Headless RGB-D/Gazebo-truth comparison at all three stations measured
    # depth-point-minus-center forward errors of +0.011, +0.011, -0.003 m.
    # The signed -5 mm correction minimizes the worst observed center error.
    depth_to_center_forward: -0.005

  stations:
    - number: 35
      area_bounds: {x_min: -0.95, x_max: -0.77, y_min: -0.69, y_max: -0.36}
      # Keep a 0.400 m safety standoff from the close_navi region center;
      # supplemental observation covers views missed at this primary pose.
      x: -1.26
      y: -0.525
      yaw: 0.00007722691751649312
      scan_positions: [0.0, 0.15, 0.60, 2.0, 0.0]
      # After both primary attempts fail, approach to the previous committed
      # observation pose, then use the supplemental arm pose.
      supplemental_pose:
        x: -1.2243
        y: -0.525
        yaw: 0.00007722691751649312
      supplemental_scan_positions: [0.0, 0.3, 0.60, 1.8, 0.0]
    - number: 36
      area_bounds: {x_min: -1.56, x_max: -1.23, y_min: -0.01, y_max: 0.17}
      x: -1.395
      # Match seq35's 0.400 m safety standoff from the region center.
      y: -0.320
      yaw: 1.5691910264536908
      scan_positions: [0.0, 0.15, 0.60, 2.0, 0.0]
      supplemental_pose:
        x: -1.395
        y: -0.235
        yaw: 1.5691910264536908
      supplemental_scan_positions: [0.0, 0.3, 0.60, 1.8, 0.0]
    - number: 37
      area_bounds: {x_min: -2.10, x_max: -1.92, y_min: -0.61, y_max: -0.28}
      # Match seq35's 0.400 m safety standoff from the region center.
      x: -1.610
      y: -0.445
      yaw: 3.141482426814858
      scan_positions: [0.0, 0.0, 0.55, 2.20, 0.0]
      supplemental_pose:
        x: -1.65569836894096
        y: -0.44503905352630406
        yaw: 3.141482426814858
      supplemental_scan_positions: [0.0, 0.3, 0.60, 1.8, 0.0]

  manipulation:
    arm_command_topic: /arm_controller/command
    gripper_command_topic: /gripper_controller/command
    joint_state_topic: /joint_states
    ready_topic: /grasp_attach/ready
    state_topic: /grasp_attach/state
    offset_topic: /grasp_attach/offset
    open_position: 1.5
    open_minimum: 1.4
    closed_position: 0.76
    arm_duration: 3.0
    arm_tolerance: 0.03
    command_timeout: 8.0
    # Arm trajectories run in Gazebo simulation time.  A separate wall-clock
    # watchdog prevents a frozen /clock from hanging the task forever.
    arm_sim_settle_timeout: 3.0
    arm_wall_timeout: 30.0
    clock_stall_timeout: 10.0
    joint_feedback_max_age: 1.0
    ready_sim_timeout: 3.0
    ready_wall_timeout: 15.0
    # Release repeats the latched 1.5 command while polling attachment/joint
    # feedback, then requires a continuous IDLE/open confirmation window.
    release_command_rate: 10.0
    release_confirmation_duration: 1.0
    grasp_positions: [0.0, 1.5, 0.3, 1.2, 0.0]
    # Low placement pose recorded in docs/锥桶区导航纪要.md. The closed gripper
    # reaches this pose before any open command is sent.
    release_positions: [0.0, 0.70, 1.7, 0.5, 0.0]
