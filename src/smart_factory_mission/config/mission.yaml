# Mission orchestration parameters. No track coordinates belong in this file.
pipeline_stop_after: ARRIVED_PICKUP_STAGING
goal_source: development

task:
  remember_completed_results: 20

navigation:
  action_name: /move_base
  server_wait_timeout: 10.0
  goal_timeout: 60.0
  max_retries: 1
  # Publish a latched reference Path, track monotonic arc progress, and replace
  # a moving lookahead MoveBaseGoal without an explicit cancel/stop gap.
  path_tracking:
    path_topic: /sim_task/reference_path
    tracking_goal_topic: /sim_task/tracking_goal
    progress_topic: /sim_task/path_progress
    control_frequency: 20.0
    acquire_radius: 0.20
    # Must remain well above DWA's 0.10 m xy_goal_tolerance; otherwise a sharp
    # bend can make the moving target look already reached and stall progress.
    lookahead_min: 0.20
    lookahead_max: 0.50
    lookahead_curvature_gain: 0.45
    projection_window: 1.0
    goal_update_distance: 0.12
    goal_update_period: 0.8
    cross_track_warn: 0.08
    cross_track_abort: 0.25
    progress_timeout: 15.0
    progress_epsilon: 0.05
    final_phase_distance: 0.30
    route_timeout: 240.0
    # Follow the fitted curve through seq 20 -> 21, then run seq 21 -> 22 as a
    # checked straight section by jumping the moving target to the seq 22
    # anchor once path progress enters that segment.
    direct_segments:
      - [21, 22]
    # Each lock blends toward its straight-section direction before the full-lock
    # anchor, holds that yaw after the anchor, then releases over the final 0.12 m.
    # Position targets continue following the fitted/direct path unchanged.
    heading_locks:
      - start_seq: 160
        full_lock_seq: 17
        end_seq: 18
        direction_start_seq: 17
        direction_end_seq: 18
        release_distance: 0.12
      # Keep the left-facing correction inside the seq 20 -> 21 corner so the
      # robot remains aligned with the vertical corridor before seq 20.
      - start_seq: 20
        full_lock_seq: 21
        end_seq: 22
        direction_start_seq: 21
        direction_end_seq: 22
        release_distance: 0.12
localization:
  amcl_topic: /amcl_pose
  map_frame: map
  base_frame: base_footprint
  wait_timeout: 10.0
  # AMCL may keep the last pose stamp while a localized robot is stationary.
  # A stale pose is accepted only while the live map-to-base TF remains fresh.
  max_pose_age: 1.0
  max_tf_age: 1.0
  allow_stale_pose_with_fresh_tf: true
  max_xy_variance: 0.05
  max_yaw_variance: 0.10
  require_tf: true
