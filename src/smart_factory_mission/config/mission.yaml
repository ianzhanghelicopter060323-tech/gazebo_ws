# Mission orchestration parameters. No track coordinates belong in this file.
pipeline_stop_after: ARRIVED_PICKUP_STAGING
goal_source: development

task:
  remember_completed_results: 20

navigation:
  action_name: /move_base
  server_wait_timeout: 10.0
  goal_timeout: 60.0
  max_retries: 1
  # Intermediate route points normally advance on position alone. Selected route
  # waypoint numbers cancel their active move_base goal after entering the pass
  # radius, rotate in place to their configured yaw, and then advance. The final
  # point remains fully precise.
  intermediate_pass_radius: 0.20
  # Temporarily disable the seq 6 -> 7 heading-alignment gate.
  # heading_constrained_waypoints: [6]
  heading_constrained_waypoints: []
  intermediate_yaw_tolerance: 0.25
  heading_alignment_timeout: 8.0
  heading_alignment_kp: 1.0
  # The Gazebo chassis barely responds below about 0.3 rad/s. Keep the in-place
  # command above static friction while retaining the existing 0.45 rad/s cap.
  heading_alignment_min_angular_speed: 0.40
  heading_alignment_max_angular_speed: 0.45
  cmd_vel_topic: /cmd_vel
  # This route stops above the random-cone region, so waypoint-driven switching
  # remains disabled. The automatic profile is applied by gazebo_nav at launch;
  # enable this block when a later route contains cone-zone waypoints. Bounds
  # are one-based and inclusive.
  profile_switching:
    enabled: false
    cone_zone_start_waypoint: 0
    cone_zone_end_waypoint: 0
    service_wait_timeout: 3.0
    automatic_service: /navigation_profile_manager/use_automatic_navigation
    cone_service: /navigation_profile_manager/use_cone_zone_avoidance

localization:
  amcl_topic: /amcl_pose
  map_frame: map
  base_frame: base_footprint
  wait_timeout: 10.0
  # AMCL may keep the last pose stamp while a localized robot is stationary.
  # A stale pose is accepted only while the live map-to-base TF remains fresh.
  max_pose_age: 1.0
  max_tf_age: 1.0
  allow_stale_pose_with_fresh_tf: true
  max_xy_variance: 0.05
  max_yaw_variance: 0.10
  require_tf: true
