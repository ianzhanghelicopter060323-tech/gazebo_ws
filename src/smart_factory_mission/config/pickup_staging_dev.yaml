# DEVELOPMENT-ONLY pickup staging route.
#
# The active poses below were captured from manual move_base goals and are sent
# sequentially. An intermediate waypoint normally advances when the localized
# base enters the configured pass radius; selected points may additionally gate
# on yaw. Only the final waypoint requires move_base GoalStatus.SUCCEEDED and
# therefore exact final position/orientation alignment.
# yaw is calculated from each recorded planar quaternion with
# yaw = 2 * atan2(orientation.z, orientation.w).
# Coordinates follow the record order in docs/navi_pos.md. The fourth record is
# treated as seq 4 even though its captured header repeats seq 1.
#
# This fixed development route must be replaced by runtime perception-derived
# goals before the competition. The final pose is a staging pose, not a cube
# coordinate.
