# The active poses below were captured from manual move_base goals and are sent
# sequentially. An intermediate waypoint advances when the localized base enters
# the configured pass radius. The final seq35 waypoint uses the global
# navigation/final_pass_radius together with navigation/final_yaw_tolerance.
# yaw is calculated from each recorded planar quaternion with
# yaw = 2 * atan2(orientation.z, orientation.w).
# Coordinates follow the record order in docs/navi_pos.md; its fourth record is
# treated as seq 4 even though the captured header repeats seq 1. Seq 1-34 use
# the coordinates from commit ddcb359 ("nvigation already good enough"); the
# pickup observation poses from seq35 onward retain their current calibration.
#
# This fixed development route must be replaced by runtime perception-derived
# goals before the competition. The final pose is a staging pose, not a cube
# coordinate.
